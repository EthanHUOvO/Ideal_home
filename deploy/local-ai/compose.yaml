name: ideal-home-local

services:
  web:
    image: ${WEB_IMAGE:-ideal-home-local:web}
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AI_MODE: local
      LOCAL_TEXT_BASE_URL: http://ai-gateway:8300/text/v1
      LOCAL_TEXT_MODEL: Qwen3.8-27B-UD-Q4_K_XL
      LOCAL_VISION_PROJECTOR: mmproj-F16.gguf
      LOCAL_IMAGE_BASE_URL: http://ai-gateway:8300/image
      LOCAL_IMAGE_MODEL: Qwen-Image-2.1
      PASCAL_MCP_URL: http://pascal-mcp:3100/mcp
      QWEN_TEXT_TIMEOUT_MS: "600000"
      QWEN_IMAGE_TIMEOUT_MS: "900000"
      GENERATED_IMAGE_DIR: /data/generated
      VULKAN_DEVICE_VISIBLE: "true"
      VULKAN_DEVICE: /dev/dri/renderD128
    volumes:
      - ${DATA_ROOT:-/srv/ideal-home/data}/generated:/data/generated
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "${WEB_PORT:-3001}:3000"
    depends_on:
      - ai-gateway
      - pascal-mcp
    networks: [local-ai, web-ingress]

  ai-gateway:
    image: ${WEB_IMAGE:-ideal-home-local:web}
    restart: unless-stopped
    command: ["node", "--experimental-strip-types", "services/local-ai-gateway/server.ts"]
    environment:
      LOCAL_AI_GATEWAY_PORT: "8300"
      TEXT_UPSTREAM: http://qwen-text:8080
      IMAGE_UPSTREAM: http://qwen-image:8200
    depends_on:
      - qwen-text
      - qwen-image
    networks: [local-ai]

  qwen-text:
    image: ${LLAMA_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-vulkan}
    restart: unless-stopped
    command:
      - --model
      - /models/Qwen3.8-27B-UD-Q4_K_XL.gguf
      - --mmproj
      - /models/mmproj-F16.gguf
      - --alias
      - Qwen3.8-27B-UD-Q4_K_XL
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "32768"
      - --parallel
      - "1"
      - --n-gpu-layers
      - "99"
      - --jinja
      - --reasoning-format
      - none
      - --no-reasoning-preserve
      - --image-min-tokens
      - "1024"
      - --metrics
      - --no-webui
    volumes:
      - ${MODEL_ROOT:-/srv/ideal-home/models}/text:/models:ro
    devices:
      - /dev/dri:/dev/dri
    environment:
      GGML_VK_VISIBLE_DEVICES: "0"
    shm_size: 2gb
    networks: [local-ai]

  qwen-image:
    image: ${QWEN_IMAGE_IMAGE:-ideal-home-local:qwen-image}
    build:
      context: ../..
      dockerfile: deploy/local-ai/Dockerfile.qwen-image
      args:
        QWEN_IMAGE_RUNTIME_VERSION: ${QWEN_IMAGE_RUNTIME_VERSION:-20260924}
    restart: unless-stopped
    environment:
      LOCAL_IMAGE_PORT: "8200"
      QWEN_IMAGE_MODEL_PATH: /models/qwenimage21
      GENERATED_IMAGE_DIR: /data/generated
      QWEN_IMAGE_TMP_DIR: /tmp/qwen-image-jobs
      QWEN_IMAGE_JOB_TIMEOUT_MS: "900000"
    volumes:
      - ${MODEL_ROOT:-/srv/ideal-home/models}/qwen-image:/models:ro
      - ${DATA_ROOT:-/srv/ideal-home/data}/generated:/data/generated
    devices:
      - /dev/dri:/dev/dri
    shm_size: 2gb
    networks: [local-ai]

  pascal-mcp:
    image: ${WEB_IMAGE:-ideal-home-local:web}
    restart: unless-stopped
    command: ["npm", "run", "mcp:start"]
    environment:
      NODE_ENV: production
      PASCAL_MCP_PORT: "3100"
      PASCAL_SCENE_DIR: /data/scenes
      LOCAL_TEXT_MODEL: Qwen3.8-27B-UD-Q4_K_XL
    volumes:
      - ${DATA_ROOT:-/srv/ideal-home/data}/scenes:/data/scenes
    networks: [local-ai]

networks:
  local-ai:
    internal: true
  web-ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
